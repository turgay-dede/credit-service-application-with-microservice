version: '3.9'
services:
  config-server:
    container_name: config-server
    build:
      context: /config-server
      dockerfile: Dockerfile
    image: config-server
    ports:
      - "8888:8888"
    environment:
      - SERVICE_REGISTRY_HOST=service-registry
      - SERVICE_REGISTRY_PORT=8761
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spring

  cloud-gateway:
    container_name: cloud-gateway
    build:
      context: /cloud-gateway
      dockerfile: Dockerfile
    image: cloud-gateway
    ports:
      - "8084:8084"
    environment:
      - CLOUD_GATEWAY_HOST=cloud-gateway
      - CLOUD_GATEWAY_PORT=8084
      - SERVICE_REGISTRY_HOST=service-registry
      - SERVICE_REGISTRY_PORT=8761
      - CONFIG_SERVER_HOST=config-server
      - CONFIG_SERVER_PORT=8888
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - spring

  service-registry:
    container_name: service-registry
    build:
      context: /service-registry
      dockerfile: Dockerfile
    image: service-registry
    ports:
      - "8761:8761"
    environment:
      - EUREKA_HOST=service-registry
    networks:
      - spring

  postgres-keycloak:
    container_name: postgres-keycloak
    image: postgres:14
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: keycloak_db
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spring
      - keycloak-and-postgres-network
    restart: unless-stopped

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:22.0.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_FEATURES: token-exchange,admin-fine-grained-authz
      KC_HOSTNAME: localhost
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    volumes:
      - ./realms:/opt/keycloak/data/import
    networks:
      - spring
      - keycloak-and-postgres-network
    restart: unless-stopped

  postgres-customer:
    container_name: postgres-customer
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: customers
    volumes:
      - customer-postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spring
      - customer-and-postgres-network
    restart: unless-stopped

  customer-service:
    container_name: customer-service
    build:
      context: /customer-service
      dockerfile: Dockerfile
    image: customer-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-customer:5432/customers
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123456
      - SERVICE_REGISTRY_HOST=service-registry
      - SERVICE_REGISTRY_PORT=8761
      - CONFIG_SERVER_HOST=config-server
      - CONFIG_SERVER_PORT=8888
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=9090
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      cloud-gateway:
        condition: service_healthy
      postgres-customer:
        condition: service_healthy
    networks:
      - spring
      - customer-and-postgres-network

  auth-service:
    container_name: auth-service
    build:
      context: /auth-service
      dockerfile: Dockerfile
    image: auth-service
    ports:
      - "9095:9095"
    environment:
      - SERVICE_REGISTRY_HOST=service-registry
      - SERVICE_REGISTRY_PORT=8761
      - CONFIG_SERVER_HOST=config-server
      - CONFIG_SERVER_PORT=8888
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=9090
    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
      cloud-gateway:
        condition: service_healthy
    networks:
      - spring

networks:
  spring:
    driver: bridge
  keycloak-and-postgres-network:
    driver: bridge
  customer-and-postgres-network:
    driver: bridge

volumes:
  keycloak-postgres-data:
  customer-postgres-data:
